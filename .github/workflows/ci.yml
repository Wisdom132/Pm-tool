name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build-extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: inline-edit-tool/extension/package-lock.json
      - run: npm ci --prefix inline-edit-tool/extension
      - run: npm run build:ext
      - name: Verify build output
        run: |
          for f in content.js background.js popup.js sidepanel.js \
                   manifest.json page.css popup.html sidepanel.html; do
            test -s "inline-edit-tool/extension/dist/$f" || { echo "missing or empty: $f"; exit 1; }
          done

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix inline-edit-tool/extension
      # preview.html drives dist/, so the extension must be built first.
      - run: npm run build:ext
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.12 or newer: the codemods import @babel/parser 8, which is
          # ESM-only, and the Nest build is CommonJS. Older runtimes build
          # fine and then fail on the first JSX edit.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run build:api

  annotation-guard:
    name: No annotations in production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Guards the guard: it must reject an annotated file and accept a clean one.
      - name: Self-check
        run: |
          mkdir -p /tmp/clean /tmp/dirty
          echo '<html><h1>Hi</h1></html>' > /tmp/clean/index.html
          echo '<h1 data-edit-file="src/Hero.tsx">Hi</h1>' > /tmp/dirty/index.html
          node scripts/check-no-annotations.mjs /tmp/clean
          if node scripts/check-no-annotations.mjs /tmp/dirty; then
            echo "guard failed to reject an annotated file"; exit 1
          fi
