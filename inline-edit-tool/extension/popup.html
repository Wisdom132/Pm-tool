<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inline Edit Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #111827;
      background: #fff;
    }

    .header {
      background: #1a1a2e;
      color: #e2e8f0;
      padding: 12px 14px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title { font-size: 13px; font-weight: 600; flex: 1; }

    .body { padding: 14px; }

    /* Status pill */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.green  { background: #16a34a; }
    .status-dot.yellow { background: #d97706; }
    .status-text { font-size: 12px; color: #374151; flex: 1; }

    /* Settings preview */
    .preview-row {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 4px 8px;
      align-items: baseline;
      margin-bottom: 5px;
    }

    .preview-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9ca3af;
      text-align: right;
    }

    .preview-value {
      font-size: 12px;
      color: #374151;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: 'Menlo', 'Consolas', monospace;
    }

    .preview-value.empty { color: #d1d5db; font-style: italic; font-family: inherit; }

    /* Hint */
    .hint {
      font-size: 11px;
      color: #92400e;
      line-height: 1.5;
      padding: 8px 10px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    /* Edit form */
    #edit-form { display: none; }
    #edit-form.visible { display: block; }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 10px 0 4px;
    }

    input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      color: #111827;
      background: #f9fafb;
    }

    input:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 0;
      border-color: #3b82f6;
      background: #fff;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 12px;
    }

    #save-status { font-size: 11px; color: #16a34a; flex: 1; }

    .btn {
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .btn-ghost {
      background: transparent;
      color: #6b7280;
      border: 1px solid #e5e7eb;
    }
    .btn-ghost:hover { background: #f9fafb; }

    .btn-primary {
      background: #1d4ed8;
      color: #fff;
      border: none;
      font-weight: 500;
    }
    .btn-primary:hover { background: #1e40af; }

    /* Editor toggle */
    #editor-toggle-btn {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 12px;
      transition: background 0.1s;
    }
    #editor-toggle-btn.off {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }
    #editor-toggle-btn.off:hover { background: #dcfce7; }
    #editor-toggle-btn.on {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    #editor-toggle-btn.on:hover { background: #fee2e2; }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-title">Inline Edit Tool</span>
  </div>

  <div class="body">

    <div class="status-row">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text"></span>
    </div>

    <!-- Saved settings preview -->
    <div id="preview-section">
      <div class="preview-row">
        <span class="preview-label">Service</span>
        <span class="preview-value" id="pv-url"></span>
      </div>
    </div>

    <!-- Editor on/off toggle -->
    <button id="editor-toggle-btn" class="off">Show Editor</button>

    <!-- First-time hint -->
    <div class="hint" id="hint-section" style="display:none">
      <p style="margin:0 0 8px">
        Paste a token from the dashboard — <strong>Your account → Browser
        extension</strong>. It signs you in to Inline Edit, not to GitHub,
        so no repository credential ever reaches this browser.
      </p>
      <input id="sign-in-token" type="password" placeholder="Paste your extension token" autocomplete="off" />
      <button class="btn btn-primary" id="sign-in-btn" style="margin-top:8px;width:100%">Sign in</button>
      <p id="sign-in-error" style="margin:8px 0 0;color:#dc2626;display:none"></p>
    </div>

    <!-- Edit form — only Service URL; auth is via OAuth -->
    <div id="edit-form">
      <label class="field-label" for="prServiceUrl">Service URL</label>
      <input id="prServiceUrl" type="url" placeholder="http://localhost:3001" />
    </div>

    <div class="footer">
      <span id="save-status"></span>
      <button class="btn btn-ghost" id="disconnect-btn" style="display:none">Disconnect</button>
      <button class="btn btn-ghost" id="toggle-btn">Edit settings</button>
      <button class="btn btn-primary" id="save-btn" style="display:none">Save</button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
