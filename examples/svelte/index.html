<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Svelte — inline edit example</title>
    <!-- Inline rather than a shared file one directory up: Vite serves the
         dev app from this folder, and a path outside it falls through to
         index.html instead of the stylesheet. -->
    <style>
      body {
        margin: 0;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      .example-bar {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 14px 22px;
        background: #0f172a;
        color: #e2e8f0;
      }
      .example-bar strong { font-size: 14px; }
      .example-bar code {
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #94a3b8;
      }
      .example-bar span { margin-left: auto; font-size: 12px; color: #94a3b8; }
      main { max-width: 720px; margin: 0 auto; padding: 28px 22px; }
    </style>
  </head>
  <body>
    <!-- Every example renders the same component, so the page has to say
         which framework built it. -->
    <div class="example-bar">
      <strong>Svelte</strong>
      <code>src/Banner.svelte</code>
      <span>alt-click any line of text</span>
    </div>
    <main></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
